name: Feature request
description: Propose a focused capability or workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain the user problem and the result you want.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and safety considerations
      description: Explain how the proposal preserves evidence status, approval gates, and private-data boundaries.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the feature complete.
