<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Finance evaluation scope</title>
  <desc id="description">Sixteen fictional transactions and a requested 92-day source window enter the finance evaluation.</desc>
  <rect width="1200" height="675" rx="30" fill="#0f172a"/>
  <circle cx="1090" cy="30" r="250" fill="#7c3aed" opacity="0.35"/>
  <circle cx="1130" cy="650" r="270" fill="#22d3ee" opacity="0.08"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="88" fill="#c4b5fd" font-size="19" font-weight="700" letter-spacing="3">MEASURED FICTIONAL DEMO</text>
    <text x="70" y="145" fill="#ffffff" font-size="42" font-weight="800">Start with the evidence</text>
    <text x="70" y="182" fill="#e0e7ff" font-size="21">Import normalized records, preserve provenance, and measure the window actually returned.</text>
    <g transform="translate(70 228)">
      <rect width="650" height="345" rx="26" fill="#ffffff"/>
      <text x="32" y="54" fill="#1e1b4b" font-size="18" font-weight="800">FICTIONAL TRANSACTION IMPORT</text>
      <g transform="translate(32 86)"><rect width="586" height="72" rx="16" fill="#eef2ff"/><circle cx="38" cy="36" r="20" fill="#6366f1"/><path d="M38 23v26m-9-9l9 9 9-9" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="32" fill="#312e81" font-size="18" font-weight="800">16 raw transactions</text><text x="76" y="55" fill="#64748b" font-size="15">CSV fixture with explicit source fields</text></g>
      <g transform="translate(32 174)"><rect width="586" height="72" rx="16" fill="#f0fdfa"/><circle cx="38" cy="36" r="20" fill="#14b8a6"/><path d="M28 36h20m-10-10v20" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="76" y="32" fill="#134e4a" font-size="18" font-weight="800">Multiple transaction types</text><text x="76" y="55" fill="#64748b" font-size="15">Purchases, transfers, payments, refunds, cashback</text></g>
      <g transform="translate(32 262)"><rect width="586" height="56" rx="16" fill="#f8fafc"/><text x="24" y="35" fill="#475569" font-size="16">Static fictional data only - no account connection</text></g>
    </g>
    <g transform="translate(760 228)">
      <rect width="370" height="160" rx="24" fill="#ffffff" opacity="0.98"/>
      <text x="28" y="44" fill="#64748b" font-size="16" font-weight="700">REQUESTED SOURCE WINDOW</text>
      <text x="28" y="97" fill="#0f172a" font-size="42" font-weight="800">92 days</text>
      <text x="28" y="130" fill="#64748b" font-size="16">June 1 through August 31</text>
      <g transform="translate(0 185)"><rect width="370" height="160" rx="24" fill="#312e81"/><circle cx="46" cy="50" r="21" fill="#a3e635"/><path d="M37 50l7 7 14-17" fill="none" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="48" fill="#ffffff" font-size="19" font-weight="800">Read-only evaluation</text><text x="82" y="77" fill="#e0e7ff" font-size="16">External actions stay gated</text><text x="28" y="126" fill="#c4b5fd" font-size="15" font-weight="700">EVIDENCE BEFORE ADVICE</text></g>
    </g>
    <text x="1130" y="635" fill="#c4b5fd" font-size="17" text-anchor="end">1 / 3</text>
  </g>
</svg>
