<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Finance reconciliation</title>
  <desc id="description">The finance evaluation deduplicates records, excludes non-purchase activity, and totals nine clean purchase-spending records.</desc>
  <rect width="1200" height="675" rx="30" fill="#1e1b4b"/>
  <circle cx="1120" cy="90" r="250" fill="#7c3aed" opacity="0.42"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="88" fill="#c4b5fd" font-size="19" font-weight="700" letter-spacing="3">DETERMINISTIC RECONCILIATION</text>
    <text x="70" y="145" fill="#ffffff" font-size="42" font-weight="800">Clean the records before totaling</text>
    <text x="70" y="182" fill="#e0e7ff" font-size="21">Transfers, payments, refunds, and cashback do not become purchase spending.</text>
    <g transform="translate(70 238)">
      <rect width="1060" height="112" rx="24" fill="#ffffff"/>
      <g transform="translate(30 24)"><circle cx="32" cy="32" r="32" fill="#6366f1"/><text x="32" y="41" fill="#fff" font-size="26" font-weight="800" text-anchor="middle">16</text><text x="84" y="28" fill="#0f172a" font-size="18" font-weight="800">RAW</text><text x="84" y="53" fill="#64748b" font-size="15">fictional rows</text></g>
      <path d="M260 56h94" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round"/><path d="M344 44l16 12-16 12" fill="none" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(390 24)"><circle cx="32" cy="32" r="32" fill="#14b8a6"/><text x="32" y="41" fill="#fff" font-size="26" font-weight="800" text-anchor="middle">16</text><text x="84" y="28" fill="#0f172a" font-size="18" font-weight="800">DEDUPED</text><text x="84" y="53" fill="#64748b" font-size="15">provenance retained</text></g>
      <path d="M650 56h94" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round"/><path d="M734 44l16 12-16 12" fill="none" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(780 24)"><circle cx="32" cy="32" r="32" fill="#a3e635"/><text x="32" y="41" fill="#1e1b4b" font-size="26" font-weight="800" text-anchor="middle">9</text><text x="84" y="28" fill="#0f172a" font-size="18" font-weight="800">PURCHASES</text><text x="84" y="53" fill="#64748b" font-size="15">clean spending records</text></g>
    </g>
    <g transform="translate(70 382)">
      <rect width="660" height="190" rx="24" fill="#ffffff"/>
      <text x="30" y="45" fill="#64748b" font-size="16" font-weight="700">CLEAN PURCHASE SPENDING</text>
      <text x="30" y="102" fill="#0f172a" font-size="44" font-weight="800">$4,510.72</text>
      <g transform="translate(30 127)" font-size="16"><text x="0" y="22" fill="#475569">Housing</text><text x="190" y="22" fill="#0f172a" font-weight="700">$4,200.00</text><text x="325" y="22" fill="#475569">Groceries</text><text x="462" y="22" fill="#0f172a" font-weight="700">$265.75</text><text x="0" y="52" fill="#475569">Subscriptions</text><text x="190" y="52" fill="#0f172a" font-weight="700">$44.97</text></g>
    </g>
    <g transform="translate(760 382)">
      <rect width="370" height="190" rx="24" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <text x="28" y="44" fill="#c4b5fd" font-size="16" font-weight="700">ACTUAL SOURCE COVERAGE</text>
      <text x="28" y="100" fill="#ffffff" font-size="42" font-weight="800">76 days</text>
      <text x="28" y="130" fill="#e0e7ff" font-size="17">82.61% of 92 requested</text>
      <rect x="28" y="151" width="314" height="12" rx="6" fill="#312e81"/><rect x="28" y="151" width="259" height="12" rx="6" fill="#22d3ee"/>
    </g>
    <text x="1130" y="635" fill="#c4b5fd" font-size="17" text-anchor="end">2 / 3</text>
  </g>
</svg>
