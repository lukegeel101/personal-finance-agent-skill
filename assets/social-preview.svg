<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Personal Finance Control Center</title>
  <desc id="description">A polished social preview showing a privacy-first financial control center and evidence-based decisions.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#312e81"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#312e81"/>
  <circle cx="1110" cy="20" r="270" fill="#ffffff" opacity="0.045"/>
  <circle cx="1190" cy="620" r="310" fill="#22d3ee" opacity="0.05"/>
  <circle cx="60" cy="650" r="220" fill="#a3e635" opacity="0.04"/>

  <g transform="translate(72 88)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="38" fill="#c4b5fd" font-size="21" font-weight="700" letter-spacing="3">PRIVACY-FIRST AGENTIC FINANCE</text>
    <text x="0" y="116" fill="#ffffff" font-size="58" font-weight="800">Personal Finance</text>
    <text x="0" y="180" fill="#ffffff" font-size="58" font-weight="800">Control Center</text>
    <text x="0" y="238" fill="#e0e7ff" font-size="25">Reconcile evidence. Find recurring costs.</text>
    <text x="0" y="276" fill="#e0e7ff" font-size="25">Plan the next smart move.</text>

    <g transform="translate(0 324)" font-size="17" font-weight="700">
      <rect width="136" height="48" rx="24" fill="#ffffff" opacity="0.14"/>
      <text x="23" y="30" fill="#ffffff">Budgets</text>
      <g transform="translate(150 0)">
        <rect width="204" height="48" rx="24" fill="#ffffff" opacity="0.14"/>
        <text x="23" y="30" fill="#ffffff">Recurring charges</text>
      </g>
      <g transform="translate(368 0)">
        <rect width="180" height="48" rx="24" fill="#ffffff" opacity="0.14"/>
        <text x="23" y="30" fill="#ffffff">Approval gates</text>
      </g>
    </g>
    <text x="0" y="448" fill="#c4b5fd" font-size="18" font-weight="700">github.com/lukegeel101/personal-finance-agent-skill</text>
  </g>

  <g transform="translate(824 144) scale(1.1)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect width="340" height="310" rx="28" fill="#ffffff" fill-opacity="0.97"/>
    <text x="30" y="48" fill="#1e1b4b" font-size="16" font-weight="800">DECISION-READY SNAPSHOT</text>
    <text x="30" y="94" fill="#64748b" font-size="14">Clean spending after reconciliation</text>
    <text x="30" y="134" fill="#0f172a" font-size="34" font-weight="800">$2,184</text>
    <g transform="translate(32 166)">
      <rect x="0" y="60" width="38" height="42" rx="9" fill="#c4b5fd"/>
      <rect x="54" y="34" width="38" height="68" rx="9" fill="#818cf8"/>
      <rect x="108" y="50" width="38" height="52" rx="9" fill="#38bdf8"/>
      <rect x="162" y="12" width="38" height="90" rx="9" fill="#22d3ee"/>
      <rect x="216" y="28" width="38" height="74" rx="9" fill="#a3e635"/>
    </g>
    <path d="M30 288h280" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0f172a" filter="url(#shadow)">
    <g transform="translate(776 72)">
      <rect width="202" height="54" rx="16" fill="#ffffff"/>
      <circle cx="27" cy="27" r="10" fill="#a3e635"/>
      <text x="48" y="33">3 charges found</text>
    </g>
    <g transform="translate(1042 492)">
      <rect width="182" height="54" rx="16" fill="#ffffff"/>
      <circle cx="27" cy="27" r="10" fill="#22d3ee"/>
      <text x="48" y="33">Evidence fresh</text>
    </g>
  </g>
</svg>
